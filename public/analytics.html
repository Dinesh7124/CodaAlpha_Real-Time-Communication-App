<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analytics — RTC</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="dash-body">
  <header class="topbar">
    <div class="topbar-left">
      <a href="/app.html" class="brand"><span class="logo-dot">◉</span> RTC</a>
      <span class="room-name">Meeting Analytics</span>
    </div>
    <div class="topbar-right">
      <button id="themeToggle" class="icon-btn">🌙</button>
      <a href="/app.html" class="btn btn-ghost">Back</a>
    </div>
  </header>

  <main class="dash-main">
    <section class="panel">
      <h2 id="roomTitle">Loading…</h2>
      <p class="hint" id="roomSub"></p>
      <div id="stats" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-top: 20px;"></div>
    </section>

    <section class="panel">
      <h2>🤖 AI Meeting Summary</h2>
      <p class="hint">Extractive summary generated from the meeting transcript.</p>
      <div id="summary" style="padding: 16px; background: var(--bg-3); border-radius: 12px; border: 1px solid var(--line); white-space: pre-wrap; line-height: 1.6; font-size: 14px; min-height: 80px;">
        Loading…
      </div>
      <p style="font-size: 12px; color: var(--muted); margin-top: 10px;" id="summaryMeta"></p>
    </section>

    <section class="panel">
      <h2>Participants</h2>
      <p class="hint">Time spent in this meeting, sorted by duration.</p>
      <div id="participants" class="room-list"></div>
    </section>
  </main>

  <script type="module" src="/js/analytics.js"></script>
</body>
</html>
